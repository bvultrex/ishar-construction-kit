name: Playable Slice CI

on:
  push:
    branches:
      - workbench/playable-slice
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Inspect build output
        run: |
          find .output -maxdepth 2 -type f | sort | head -80
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: ishar-construction-kit-playable-slice
          path: .output
          if-no-files-found: error
          retention-days: 14
